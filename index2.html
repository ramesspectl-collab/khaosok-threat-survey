
<h2 class="sr-only">แบบประเมินปัจจัยคุกคามในพื้นที่คุ้มครอง </h2>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p50:#EEEDFE;--p100:#CECBF6;--p200:#AFA9EC;--p400:#7F77DD;--p600:#534AB7;--p800:#3C3489;}
body{font-family:var(--font-sans);font-size:16px;color:var(--color-text-primary);-webkit-tap-highlight-color:transparent}
.app{padding:1rem 0}
.step{display:none}.step.active{display:block}

.hero{background:#EEEDFE;border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:1.25rem;border:0.5px solid #CECBF6}
.hero h1{font-size:18px;font-weight:500;color:#3C3489;margin-bottom:3px;line-height:1.4}
.hero p{font-size:13px;color:#534AB7;line-height:1.5}
.live-dot{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#534AB7;background:#CECBF6;padding:2px 8px;border-radius:20px;vertical-align:middle;margin-left:5px}
.dot{width:6px;height:6px;border-radius:50%;background:#7F77DD;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

.card{background:var(--color-background-primary);border:0.5px solid #CECBF6;border-radius:var(--border-radius-lg);padding:1rem;margin-bottom:12px}

.btn-p{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:#534AB7;color:#fff;border:none;border-radius:var(--border-radius-md);padding:14px 20px;cursor:pointer;font-size:15px;font-weight:500;min-height:48px}
.btn-p:hover{background:#3C3489}
.btn-p:disabled{opacity:0.5}
.btn-g{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:var(--color-background-primary);border:0.5px solid #AFA9EC;border-radius:var(--border-radius-md);padding:13px 20px;cursor:pointer;font-size:15px;color:#534AB7;min-height:48px}
.btn-g:hover{background:#EEEDFE}
.btn-sm{background:var(--color-background-primary);border:0.5px solid #AFA9EC;border-radius:var(--border-radius-md);padding:10px 16px;cursor:pointer;font-size:14px;color:#534AB7;min-height:44px}
.btn-sm:hover{background:#EEEDFE}
.btn-danger{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:var(--color-background-primary);border:0.5px solid #F09595;border-radius:var(--border-radius-md);padding:13px 20px;cursor:pointer;font-size:15px;color:#A32D2D;min-height:48px}
.btn-danger:hover{background:#FCEBEB}
.btn-danger-solid{display:flex;align-items:center;justify-content:center;gap:6px;background:#A32D2D;color:#fff;border:none;border-radius:var(--border-radius-md);padding:13px 20px;cursor:pointer;font-size:15px;font-weight:500;min-height:48px;flex:1}
.btn-danger-solid:hover{background:#791F1F}

.progress-wrap{margin-bottom:1rem}
.progress-label{font-size:13px;color:#534AB7;margin-bottom:6px;font-weight:500;line-height:1.4}
.progress-bar{background:#EEEDFE;border-radius:4px;height:8px;overflow:hidden;border:0.5px solid #CECBF6}
.progress-fill{height:100%;background:#7F77DD;border-radius:4px;transition:width .3s}

.group-header{font-size:15px;font-weight:500;color:#3C3489;margin-bottom:1rem;padding-bottom:10px;border-bottom:2px solid #CECBF6;display:flex;align-items:center;gap:8px;line-height:1.4}
.group-num{background:#7F77DD;color:#fff;border-radius:6px;font-size:12px;padding:3px 9px;font-weight:500;white-space:nowrap;flex-shrink:0}

.factor-row{border:0.5px solid #CECBF6;border-radius:var(--border-radius-md);padding:1rem;margin-bottom:12px;background:var(--color-background-primary)}
.factor-name{font-size:14px;color:var(--color-text-primary);margin-bottom:12px;line-height:1.6;font-weight:500}

.field-group{margin-bottom:10px}
.field-group label{font-size:12px;color:#534AB7;font-weight:500;margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.4px}
.field-group select{width:100%;font-size:14px;padding:10px 12px;border:0.5px solid #CECBF6;border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);min-height:44px}
.field-group select:focus{outline:none;border-color:#7F77DD;box-shadow:0 0 0 2px #EEEDFE}

.impact-wrap{border-top:0.5px solid #EEEDFE;padding-top:10px;margin-top:2px}
.impact-label{font-size:12px;color:#534AB7;font-weight:500;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.impact-pills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pill-check{display:none}
.pill-label{display:flex;align-items:center;justify-content:center;font-size:14px;padding:10px 8px;border-radius:var(--border-radius-md);cursor:pointer;border:0.5px solid #CECBF6;color:#534AB7;background:var(--color-background-primary);transition:all .15s;min-height:44px;text-align:center}
.pill-check:checked+.pill-label{background:#534AB7;color:#fff;border-color:#534AB7}
.pill-nat{border-color:#9FE1CB}.pill-check:checked+.pill-nat{background:#1D9E75;border-color:#1D9E75;color:#fff}
.pill-soc{border-color:#B5D4F4}.pill-check:checked+.pill-soc{background:#185FA5;border-color:#185FA5;color:#fff}
.pill-eco{border-color:#FAC775}.pill-check:checked+.pill-eco{background:#854F0B;border-color:#854F0B;color:#fff}
.pill-cul{border-color:#CECBF6}.pill-check:checked+.pill-cul{background:#534AB7;border-color:#534AB7;color:#fff}

.nav-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:1.25rem}
.nav-row.last{grid-template-columns:1fr 1fr;gap:10px}

.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:1.25rem}
.stat-box{background:#EEEDFE;border-radius:var(--border-radius-md);padding:14px 10px;text-align:center;border:0.5px solid #CECBF6}
.stat-num{font-size:26px;font-weight:500;color:#3C3489}
.stat-lbl{font-size:12px;color:#534AB7;margin-top:3px;line-height:1.3}

.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:1.25rem}
.tab{font-size:13px;padding:11px 8px;cursor:pointer;border:0.5px solid #CECBF6;background:var(--color-background-primary);color:#534AB7;border-radius:var(--border-radius-md);text-align:center;min-height:44px;line-height:1.3}
.tab.active{background:#534AB7;color:#fff;border-color:#534AB7;font-weight:500}

.result-item{margin-bottom:10px}
.result-name{font-size:13px;color:var(--color-text-secondary);margin-bottom:4px;line-height:1.4}
.result-bar-row{display:flex;align-items:center;gap:8px}
.rbar{height:10px;border-radius:5px;background:#7F77DD;min-width:4px}
.rval{font-size:13px;font-weight:500;min-width:36px;text-align:right}

.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;margin:1px;vertical-align:middle}
.b-nat{background:#E1F5EE;color:#085041}.b-soc{background:#E6F1FB;color:#0C447C}
.b-eco{background:#FAEEDA;color:#633806}.b-cul{background:#EEEDFE;color:#3C3489}

.chip{display:inline-block;border-radius:20px;padding:5px 12px;margin:3px;font-size:13px}
.chip-done{background:#EEEDFE;color:#3C3489;border:0.5px solid #CECBF6}
.chip-wait{background:var(--color-background-secondary);color:var(--color-text-tertiary);border:0.5px solid var(--color-border-tertiary)}

.error-box{font-size:14px;color:#791F1F;padding:.75rem 1rem;background:#FCEBEB;border-radius:var(--border-radius-md);margin-bottom:12px;border:0.5px solid #F09595;line-height:1.5}
.loading{font-size:14px;color:#534AB7;padding:2rem 0;text-align:center}
.confirm-box{background:#FCEBEB;border:0.5px solid #F09595;border-radius:var(--border-radius-lg);padding:1.25rem;margin-top:12px}
.confirm-title{font-size:15px;font-weight:500;color:#A32D2D;margin-bottom:8px}
.confirm-box p{font-size:14px;color:#791F1F;margin-bottom:14px;line-height:1.6}
.confirm-btns{display:flex;gap:8px}

.fl{display:flex;align-items:center;gap:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>

<div class="app">

  <div class="hero">
    <h1><i class="ti ti-shield-check" aria-hidden="true" style="font-size:18px;vertical-align:-2px;margin-right:5px"></i>แบบประเมินปัจจัยคุกคาม <span class="live-dot"><span class="dot"></span>Live</span></h1>
    <p>กรอกจากอุปกรณ์คนละเครื่อง — ผลรวม real-time</p>
  </div>

  <div id="step-name" class="step active">
    <div class="card">
      <div id="name-error" class="error-box" style="display:none"></div>
      <div class="field-group">
        <label>ชื่อ-นามสกุล หรือรหัสผู้ประเมิน</label>
        <input type="text" id="user-name" placeholder="เช่น นายสมชาย ใจดี" style="width:100%;font-size:16px;padding:10px 12px;border:0.5px solid #CECBF6;border-radius:var(--border-radius-md);min-height:48px;background:var(--color-background-primary);color:var(--color-text-primary)"/>
      </div>
      <div class="field-group" style="margin-bottom:18px">
        <label>พื้นที่ที่ประเมิน <span style="font-weight:400;color:#AFA9EC">(ไม่บังคับ)</span></label>
        <input type="text" id="area-name" placeholder="เช่น อุทยานแห่งชาติเขาสก" style="width:100%;font-size:16px;padding:10px 12px;border:0.5px solid #CECBF6;border-radius:var(--border-radius-md);min-height:48px;background:var(--color-background-primary);color:var(--color-text-primary)"/>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn-p" onclick="startSurvey()"><i class="ti ti-clipboard-list" aria-hidden="true" style="font-size:18px"></i>เริ่มกรอกแบบประเมิน</button>
        <button class="btn-g" onclick="goResults()"><i class="ti ti-chart-bar" aria-hidden="true" style="font-size:18px"></i>ดูผลรวม</button>
      </div>
    </div>
  </div>

  <div id="step-survey" class="step">
    <div class="progress-wrap">
      <div class="progress-label" id="progress-text"></div>
      <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    </div>
    <div id="group-content"></div>
    <div class="nav-row" id="nav-row">
      <button class="btn-g" id="btn-back" onclick="prevGroup()"><i class="ti ti-arrow-left" aria-hidden="true" style="font-size:17px"></i>ย้อนกลับ</button>
      <button class="btn-g" id="btn-next" onclick="nextGroup()">ถัดไป<i class="ti ti-arrow-right" aria-hidden="true" style="font-size:17px"></i></button>
      <button class="btn-p" id="btn-submit" style="display:none;grid-column:1/-1" onclick="submitSurvey()"><i class="ti ti-check" aria-hidden="true" style="font-size:18px"></i>ส่งผลการประเมิน</button>
    </div>
  </div>

  <div id="step-done" class="step">
    <div class="card" style="text-align:center">
      <div style="width:60px;height:60px;background:#EEEDFE;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;border:0.5px solid #CECBF6">
        <i class="ti ti-circle-check" aria-hidden="true" style="font-size:30px;color:#534AB7"></i>
      </div>
      <p style="font-size:17px;font-weight:500;color:#3C3489;margin-bottom:5px">บันทึกเรียบร้อยแล้ว</p>
      <p style="font-size:14px;color:#534AB7;margin-bottom:1.25rem">ข้อมูลของคุณถูกบันทึกในระบบแล้ว</p>
      <div class="stat-grid" style="text-align:left;margin-bottom:1.25rem">
        <div class="stat-box"><div class="stat-num" id="done-total">0</div><div class="stat-lbl">ผู้ตอบทั้งหมด</div></div>
        <div class="stat-box"><div class="stat-num" id="done-present">0</div><div class="stat-lbl">ปัจจัยที่คุณระบุว่ามี</div></div>
        <div class="stat-box"><div class="stat-num" id="done-severe">0</div><div class="stat-lbl">ระดับสูง/สูงมาก</div></div>
        <div class="stat-box" style="grid-column:1/-1;display:none" id="done-extra"></div>
      </div>
      <button class="btn-p" onclick="goResults()"><i class="ti ti-chart-bar" aria-hidden="true" style="font-size:18px"></i>ดูผลรวมทั้งหมด</button>
    </div>
  </div>

  <div id="step-results" class="step">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
      <span style="font-size:14px;font-weight:500;color:#3C3489">ผลการประเมิน</span>
      <button class="btn-sm" onclick="refreshResults()"><i class="ti ti-refresh" aria-hidden="true" style="font-size:15px;vertical-align:-1px;margin-right:3px"></i>รีเฟรช</button>
    </div>
    <div class="tabs" id="result-tabs">
      <button class="tab active" onclick="switchTab('summary',event)"><i class="ti ti-chart-bar" aria-hidden="true" style="font-size:15px;display:block;margin:0 auto 3px"></i>สรุปภาพรวม</button>
      <button class="tab" onclick="switchTab('groups',event)"><i class="ti ti-list" aria-hidden="true" style="font-size:15px;display:block;margin:0 auto 3px"></i>แยกกลุ่ม</button>
      <button class="tab" onclick="switchTab('impact',event)"><i class="ti ti-layers" aria-hidden="true" style="font-size:15px;display:block;margin:0 auto 3px"></i>กระทบด้านใด</button>
      <button class="tab" onclick="switchTab('respondents',event)"><i class="ti ti-users" aria-hidden="true" style="font-size:15px;display:block;margin:0 auto 3px"></i>ผู้ประเมิน</button>
    </div>
    <div id="tab-summary"></div>
    <div id="tab-groups" style="display:none"></div>
    <div id="tab-impact" style="display:none"></div>
    <div id="tab-respondents" style="display:none"></div>
  </div>

</div>

<script>
const GROUPS=[
  {name:"ที่อยู่อาศัยและการประกอบการ",factors:["1.1 การสร้างบ้านและตั้งถิ่นฐาน","1.2 พื้นที่ธุรกิจ ร้านค้า ตลาด และอุตสาหกรรม","1.3 โครงสร้างพื้นฐานเพื่อการท่องเที่ยวและนันทนาการ"]},
  {name:"การเกษตรและการเพาะเลี้ยงสัตว์น้ำ",factors:["2.1 การเก็บเกี่ยวพืชผลในพื้นที่","2.2 การเก็บเกี่ยวเพื่อทำยาเสพติดและยาผิดกฎหมาย","2.3 การปลูกต้นไม้เพื่อผลิตไม้ซุง เยื่อกระดาษ","2.4 การเลี้ยงสัตว์บก","2.5 การเพาะเลี้ยงสัตว์น้ำ"]},
  {name:"การผลิตพลังงานและการทำเหมือง",factors:["3.1 การขุดเจาะน้ำมันและก๊าซธรรมชาติ","3.2 การทำเหมืองแร่ เหมืองหิน","3.3 การผลิตพลังงาน เขื่อน ฟาร์มลม"]},
  {name:"การคมนาคมขนส่ง",factors:["4.1 ถนนและราง","4.2 สายส่งบริการ เช่น สายโทรศัพท์","4.3 โครงสร้างพื้นฐานด้านท่องเที่ยว ถนนรอง จุดชมวิว","4.4 เส้นทางเดินอากาศ"]},
  {name:"การใช้ทรัพยากรจากระบบนิเวศ",factors:["5.1 การล่าสัตว์ การเก็บสัตว์ป่า","5.2 การเก็บพืชจากธรรมชาติ เห็ด สมุนไพร","5.3 การทำไม้ ตัดไม้","5.4 การทำประมง การจับสัตว์น้ำ"]},
  {name:"การรบกวนจากกิจกรรมมนุษย์",factors:["6.1 กิจกรรมท่องเที่ยว เช่น การเดินป่า","6.2 สงคราม ความรุนแรง การซ้อมรบ","6.3 งานวิจัย การศึกษา","6.4 กิจกรรมของเจ้าหน้าที่","6.5 การทำร้าย การข่มขู่","6.6 ผลกระทบจากกิจกรรมวัฒนธรรมและศาสนา"]},
  {name:"การเปลี่ยนแปลงสภาพธรรมชาติ",factors:["7.1 การจัดการพื้นที่เอง การถางที่อยู่","7.2 ไฟป่า การจัดการไฟป่า","7.3 การสร้างเขื่อน การเปลี่ยนเส้นทางน้ำ","7.4 ป่าถูกแบ่งแยกออกเป็นส่วนๆ","7.5 ป่าหรือพื้นที่ถูกตัดแบ่งโดยสิ้นเชิง","7.6 กิจกรรมนอกขอบป่าที่ส่งผลกระทบ","7.7 การสูญเสียชนิดพันธุ์สำคัญ ผู้ล่าลำดับสุดท้าย"]},
  {name:"การรุกรานของพืชและสัตว์ต่างถิ่น",factors:["8.1 การรุกรานของพืชต่างถิ่น วัชพืช","8.2 การรุกรานของสัตว์ต่างถิ่น","8.3 โรคระบาดในพื้นที่","8.4 พืช GMO"]},
  {name:"มลพิษ",factors:["9.1 ขยะและน้ำเสียจากชุมชน","9.2 ขยะและน้ำเสียจากบ้านพักเจ้าหน้าที่","9.3 มลพิษจากอุตสาหกรรมและเหมือง","9.4 มลพิษจากการเกษตร ปุ๋ย ยาฆ่าแมลง","9.5 ขยะมูลฝอย","9.6 มลพิษทางอากาศ ควัน","9.7 มลพิษแสงไฟ","9.8 มลพิษทางเสียง"]},
  {name:"ภัยพิบัติทางธรรมชาติ",factors:["10.1 ภูเขาไฟ","10.2 แผ่นดินไหวหรือสึนามิ","10.3 หิมะถล่มหรือแผ่นดินถล่ม","10.4 การกัดเซาะ การตกตะกอน"]},
  {name:"การเปลี่ยนแปลงสภาพภูมิอากาศ",factors:["11.1 การเปลี่ยนแปลงที่อยู่ของพืชและสัตว์","11.2 ความแห้งแล้ง","11.3 อุณหภูมิสูงหรือต่ำเกินไป","11.4 พายุและน้ำท่วม","11.5 ความเป็นกรดของมหาสมุทร","11.6 ระดับน้ำทะเลสูงขึ้น"]},
  {name:"ภัยคุกคามต่อสังคมและวัฒนธรรม",factors:["12.1 การสูญเสียวัฒนธรรมที่เชื่อมโยงกับการอนุรักษ์","12.2 การเสื่อมสภาพของจุดที่มีคุณค่าทางวัฒนธรรม","12.3 อาคารและมรดกทางวัฒนธรรมเสื่อมโทรม","12.4 การถูกยึดหรือเสียสิทธิในที่ดิน"]},
  {name:"ปัญหาความขัดแย้งด้านนโยบาย",factors:["13.1 นโยบายที่ขัดแย้งของแต่ละหน่วยงาน","13.2 บทบาทและความรับผิดชอบที่สับสน"]}
];
const PRESENCE_OPTS=["","มี","ไม่มี"];
const SEVERITY_OPTS=["","ต่ำ : คุณค่าลดลงเพียงเล็กน้อย","ปานกลาง : เสื่อมสภาพปานกลาง","สูง : เสื่อมสภาพร้ายแรง","สูงมาก : ทำลายคุณค่า"];
const SCOPE_OPTS=["","ต่ำ : เฉพาะพื้นที่","ปานกลาง : บางพื้นที่","สูง : หลายพื้นที่","สูงมาก : ทั่วพื้นที่ในวงกว้าง"];
const IMPACT_OPTS=[
  {key:"nat",label:"ธรรมชาติ",pc:"pill-nat",bc:"b-nat"},
  {key:"soc",label:"สังคม",pc:"pill-soc",bc:"b-soc"},
  {key:"eco",label:"เศรษฐกิจ",pc:"pill-eco",bc:"b-eco"},
  {key:"cul",label:"วัฒนธรรม",pc:"pill-cul",bc:"b-cul"}
];
let currentGroup=0,answers={},userName='',areaName='',cachedResponses=[],activeTab='summary';

function showStep(id){document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function blank(){return{presence:'',severity:'',scope:'',impact:[]};}
function getAns(gi,fi){return answers[gi+'_'+fi]||blank();}

function startSurvey(){
  userName=document.getElementById('user-name').value.trim();
  if(!userName){const e=document.getElementById('name-error');e.textContent='กรุณาระบุชื่อผู้ประเมิน';e.style.display='block';return;}
  document.getElementById('name-error').style.display='none';
  areaName=document.getElementById('area-name').value.trim();
  currentGroup=0;answers={};showStep('step-survey');renderGroup();
}
async function goResults(){showStep('step-results');await loadAndRenderResults();}

function renderGroup(){
  const g=GROUPS[currentGroup];
  const pct=Math.round((currentGroup/GROUPS.length)*100);
  document.getElementById('progress').style.width=pct+'%';
  document.getElementById('progress-text').textContent='กลุ่ม '+(currentGroup+1)+'/'+GROUPS.length+' — '+g.name;
  const isLast=currentGroup===GROUPS.length-1;
  document.getElementById('btn-back').style.display=currentGroup===0?'none':'';
  document.getElementById('btn-next').style.display=isLast?'none':'';
  document.getElementById('btn-submit').style.display=isLast?'':'none';
  if(currentGroup===0){
    document.getElementById('btn-back').style.display='none';
    document.getElementById('nav-row').style.gridTemplateColumns='1fr';
  } else {
    document.getElementById('nav-row').style.gridTemplateColumns=isLast?'1fr':'1fr 1fr';
  }

  let html='<div class="card"><div class="group-header"><span class="group-num">'+(currentGroup+1)+'</span>'+g.name+'</div>';
  g.factors.forEach((f,fi)=>{
    const a=getAns(currentGroup,fi);
    const pid='imp_'+currentGroup+'_'+fi;
    const impHtml=IMPACT_OPTS.map(imp=>{
      const uid=pid+'_'+imp.key;
      return `<input type="checkbox" class="pill-check" id="${uid}" onchange="setImpact(${currentGroup},${fi},'${imp.key}',this.checked)" ${a.impact.includes(imp.key)?'checked':''}>
              <label for="${uid}" class="pill-label ${imp.pc}">${imp.label}</label>`;
    }).join('');
    html+=`<div class="factor-row">
      <div class="factor-name">${f}</div>
      <div class="field-group"><label>มีในพื้นที่หรือไม่</label><select onchange="setField(${currentGroup},${fi},'presence',this.value)">${PRESENCE_OPTS.map(o=>`<option value="${o}"${a.presence===o?' selected':''}>${o||'— เลือก —'}</option>`).join('')}</select></div>
      <div class="field-group"><label>ความรุนแรง</label><select onchange="setField(${currentGroup},${fi},'severity',this.value)">${SEVERITY_OPTS.map(o=>`<option value="${o}"${a.severity===o?' selected':''}>${o||'— เลือก —'}</option>`).join('')}</select></div>
      <div class="field-group"><label>ขอบเขต</label><select onchange="setField(${currentGroup},${fi},'scope',this.value)">${SCOPE_OPTS.map(o=>`<option value="${o}"${a.scope===o?' selected':''}>${o||'— เลือก —'}</option>`).join('')}</select></div>
      <div class="impact-wrap"><div class="impact-label">กระทบด้านใด</div><div class="impact-pills">${impHtml}</div></div>
    </div>`;
  });
  html+='</div>';
  document.getElementById('group-content').innerHTML=html;
  window.scrollTo&&window.scrollTo(0,0);
}

function setField(g,f,field,val){const k=g+'_'+f;if(!answers[k])answers[k]=blank();answers[k][field]=val;}
function setImpact(g,f,key,checked){const k=g+'_'+f;if(!answers[k])answers[k]=blank();const imp=answers[k].impact;if(checked){if(!imp.includes(key))imp.push(key);}else answers[k].impact=imp.filter(x=>x!==key);}
function nextGroup(){if(currentGroup<GROUPS.length-1){currentGroup++;renderGroup();}}
function prevGroup(){if(currentGroup>0){currentGroup--;renderGroup();}}

// ลิงก์ SCRIPT_URL ตัวที่ถูกต้องของคุณ
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwBpGe4oi6-AeNIEkCAPTbLtTlOMsOZvFOfgRPauf_Ff8ibWtwMeDuXMNupeHxAsPYpIw/exec';

async function submitSurvey(){
  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = 'กำลังบันทึก...';
  
  const entry = {
    name: userName,
    area: areaName,
    time: new Date().toLocaleString('th-TH'),
    answers: answers
  };
  
  try {
    // ส่งข้อมูลไป Google Sheets
    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(entry),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    });

    cachedResponses = await loadResponses();
    let present=0, severe=0;
    Object.values(answers).forEach(a => {
      if(a.presence === 'มี') present++;
      if(a.severity.startsWith('สูง')) severe++;
    });
    
    document.getElementById('done-total').textContent = cachedResponses.length;
    document.getElementById('done-present').textContent = present;
    document.getElementById('done-severe').textContent = severe;
    showStep('step-done');
    
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'ส่งผลการประเมิน';
    alert('เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่');
  }
}

async function loadResponses(){
  try {
    const res = await fetch(SCRIPT_URL);
    return await res.json();
  } catch(e) {
    console.error("โหลดข้อมูลไม่ได้:", e);
    return [];
  }
}

function switchTab(t,e){
  activeTab=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  if(e)e.target.classList.add('active');
  ['summary','groups','impact','respondents'].forEach(id=>{
    document.getElementById('tab-'+id).style.display=id===t?'block':'none';
  });
  renderActiveTab();
}
function renderActiveTab(){
  if(activeTab==='summary')renderSummary();
  else if(activeTab==='groups')renderGroups();
  else if(activeTab==='impact')renderImpact();
  else renderRespondents();
}
function getStats(gi,fi){
  const key=gi+'_'+fi;
  let present=0,sevSum=0,imp={nat:0,soc:0,eco:0,cul:0},n=cachedResponses.length;
  cachedResponses.forEach(r=>{
    const a=(r.answers||{})[key]||blank();
    if(a.presence==='มี')present++;
    const idx=SEVERITY_OPTS.indexOf(a.severity);
    if(idx>0)sevSum+=idx;
    (a.impact||[]).forEach(k=>{if(imp[k]!==undefined)imp[k]++;});
  });
  return{pct:n?Math.round(present/n*100):0,avg:n?Math.round(sevSum/n*10)/10:0,imp,n};
}
function impBadges(imp){return IMPACT_OPTS.filter(o=>imp[o.key]>0).map(o=>`<span class="badge ${o.bc}">${o.label}</span>`).join('');}

function renderSummary(){
  const n=cachedResponses.length;
  let all=[];
  GROUPS.forEach((g,gi)=>g.factors.forEach((f,fi)=>{const s=getStats(gi,fi);all.push({name:f,...s});}));
  all.sort((a,b)=>b.pct-a.pct);
  const top=all.slice(0,10),maxPct=top[0]?.pct||1;
  let html=`<div class="card">
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-num">${n}<span style="font-size:14px;color:#7F77DD">/21</span></div><div class="stat-lbl">ผู้ตอบ</div></div>
      <div class="stat-box"><div class="stat-num">${all.filter(f=>f.pct>=50).length}</div><div class="stat-lbl">>50% ระบุว่ามี</div></div>
      <div class="stat-box"><div class="stat-num">${all.filter(f=>f.avg>=3).length}</div><div class="stat-lbl">ความรุนแรงสูง</div></div>
      <div class="stat-box"><div class="stat-num">${21-n}</div><div class="stat-lbl">ยังไม่ตอบ</div></div>
    </div>
    <div style="font-size:12px;font-weight:500;color:#534AB7;margin-bottom:12px;text-transform:uppercase;letter-spacing:.4px">10 ปัจจัยที่พบมากที่สุด</div>`;
  top.forEach(f=>{
    const col=f.pct>=70?'#791F1F':f.pct>=40?'#633806':'#534AB7';
    html+=`<div class="result-item">
      <div class="result-name">${f.name} ${impBadges(f.imp)}</div>
      <div class="result-bar-row"><div class="rbar" style="width:${Math.round(f.pct/maxPct*140)}px;background:${col}"></div><span class="rval" style="color:${col}">${f.pct}%</span></div>
    </div>`;
  });
  html+='</div>';
  document.getElementById('tab-summary').innerHTML=html;
}

function renderGroups(){
  let html='';
  GROUPS.forEach((g,gi)=>{
    html+=`<div class="card"><div class="group-header"><span class="group-num">${gi+1}</span>${g.name}</div>`;
    g.factors.forEach((f,fi)=>{
      const s=getStats(gi,fi);
      const col=s.pct>=70?'#791F1F':s.pct>=40?'#633806':'#534AB7';
      html+=`<div class="result-item">
        <div class="result-name">${f} ${impBadges(s.imp)}</div>
        <div class="result-bar-row"><div class="rbar" style="width:${s.pct}px;background:${col}"></div><span class="rval" style="color:${col}">${s.pct}%</span><span style="font-size:12px;color:#AFA9EC;margin-left:4px">avg ${s.avg}</span></div>
      </div>`;
    });
    html+='</div>';
  });
  document.getElementById('tab-groups').innerHTML=html;
}

function renderImpact(){
  const totals={nat:0,soc:0,eco:0,cul:0};
  const byGroup=GROUPS.map((g,gi)=>{
    const gc={nat:0,soc:0,eco:0,cul:0};
    g.factors.forEach((_,fi)=>{const s=getStats(gi,fi);IMPACT_OPTS.forEach(imp=>{gc[imp.key]+=s.imp[imp.key];totals[imp.key]+=s.imp[imp.key];});});
    return{name:g.name,num:gi+1,counts:gc};
  });
  let html=`<div class="card">
    <div style="font-size:12px;font-weight:500;color:#534AB7;margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px">รวมทุกการประเมิน</div>
    <div class="stat-grid" style="margin-bottom:1.25rem">`;
  IMPACT_OPTS.forEach(imp=>{html+=`<div class="stat-box"><div class="stat-num" style="color:#3C3489">${totals[imp.key]}</div><div class="stat-lbl">${imp.label}</div></div>`;});
  html+=`</div><div style="font-size:12px;font-weight:500;color:#534AB7;margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px">แยกตามกลุ่มปัจจัย</div>`;
  byGroup.forEach(g=>{
    if(!IMPACT_OPTS.some(imp=>g.counts[imp.key]>0))return;
    html+=`<div style="margin-bottom:12px;padding-bottom:12px;border-bottom:0.5px solid #EEEDFE">
      <div style="font-size:13px;font-weight:500;margin-bottom:6px"><span class="group-num" style="font-size:11px">${g.num}</span> <span style="margin-left:4px">${g.name}</span></div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">`;
    IMPACT_OPTS.forEach(imp=>{if(g.counts[imp.key]>0)html+=`<span class="badge ${imp.bc}" style="font-size:12px;padding:4px 10px">${imp.label} ${g.counts[imp.key]}</span>`;});
    html+='</div></div>';
  });
  html+='</div>';
  document.getElementById('tab-impact').innerHTML=html;
}

function renderRespondents(){
  const n=cachedResponses.length;
  let html=`<div class="card">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <span style="font-size:22px;font-weight:500;color:#3C3489">${n}</span>
      <span style="font-size:14px;color:#534AB7">จาก 21 คน (${Math.round(n/21*100)}%)</span>
    </div>
    <div style="background:#EEEDFE;border-radius:var(--border-radius-md);padding:10px 14px;margin-bottom:14px;font-size:13px;color:#3C3489">
      <span style="font-weight:500">${21-n} คน</span> ยังไม่ได้ตอบแบบประเมิน
    </div>
    <div style="margin-bottom:14px">`;
  cachedResponses.forEach(r=>{html+=`<span class="chip chip-done"><i class="ti ti-user" aria-hidden="true" style="font-size:13px;margin-right:3px"></i>${r.name}</span>`;});
  for(let i=n;i<21;i++)html+=`<span class="chip chip-wait">รอผล ${i+1}</span>`;
  html+='</div>';
  if(n>0){
    html+=`<div style="border-top:0.5px solid #EEEDFE;padding-top:12px;margin-bottom:12px">`;
    cachedResponses.forEach(r=>{
      let present=0;Object.values(r.answers||{}).forEach(a=>{if(a.presence==='มี')present++;});
      html+=`<div style="padding:10px 0;border-bottom:0.5px solid #EEEDFE">
        <div style="font-size:14px;font-weight:500;margin-bottom:2px">${r.name}${r.area?` <span style="font-weight:400;color:#7F77DD">— ${r.area}</span>`:''}</div>
        <div style="font-size:12px;color:#7F77DD">${present} ปัจจัย · ${r.time}</div>
      </div>`;
    });
    html+='</div>';
  }
  html+=`<div id="reset-area">
    <button class="btn-danger" onclick="showResetConfirm()">
      <i class="ti ti-trash" aria-hidden="true" style="font-size:17px"></i>รีเซตคำตอบทั้งหมด
    </button>
  </div></div>`;
  document.getElementById('tab-respondents').innerHTML=html;
}

function showResetConfirm(){
  const n=cachedResponses.length;
  document.getElementById('reset-area').innerHTML=`
    <div class="confirm-box">
      <div class="confirm-title"><i class="ti ti-alert-triangle" aria-hidden="true" style="font-size:17px;vertical-align:-2px;margin-right:5px"></i>ยืนยันการรีเซต</div>
      <p>จะลบคำตอบทั้งหมด <strong>${n} คน</strong> อย่างถาวร กู้คืนไม่ได้</p>
      <div class="confirm-btns">
        <button class="btn-danger-solid" onclick="doReset()"><i class="ti ti-trash" aria-hidden="true" style="font-size:17px"></i>ยืนยัน ลบทั้งหมด</button>
        <button class="btn-g" style="flex:1" onclick="cancelReset()">ยกเลิก</button>
      </div>
    </div>`;
}
function cancelReset(){
  document.getElementById('reset-area').innerHTML=`
    <button class="btn-danger" onclick="showResetConfirm()">
      <i class="ti ti-trash" aria-hidden="true" style="font-size:17px"></i>รีเซตคำตอบทั้งหมด
    </button>`;
}
async function doReset(){
  try{await window.storage.delete('threat_responses',true);cachedResponses=[];renderRespondents();}
  catch(e){alert('เกิดข้อผิดพลาด กรุณาลองใหม่');}
}
</script>
